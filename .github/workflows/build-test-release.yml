name: CI

on:
  push:
    branches:
      - "main"
      - "next"
  pull_request:
    branches: [main, next]
    # `labeled` so that adding ci:full-matrix re-runs with macOS included.
    types: [opened, synchronize, reopened, labeled]
  # No push releases anything (see the publish job's DRY). Both the rc from
  # next and the GA from main are cut by dispatching this workflow by hand.
  workflow_dispatch:

# One run per ref: a new push supersedes the one still in flight. A dispatch is
# never cancelled, it is the only thing that can cut a release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

# Read-only by default; the publish job raises what it needs and nothing else.
permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - uses: pre-commit/action@v3.0.1

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install UV
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Run Ruff
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Run mypy
        run: uv run mypy

      # Advisory only. ty is pre-1.0 and has no disallow_untyped_defs
      # equivalent, so mypy above remains the blocking gate. ty catches
      # things mypy misses, notably Liskov override violations.
      - name: Run ty (advisory)
        run: uv run ty check pyasn1
        continue-on-error: true

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install UV
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # --keep-going lists every warning instead of stopping at the first, so
      # one push fixes them all. -n (nitpicky) is the goal but not yet reachable:
      # 136 docstring cross-references still resolve to nothing. See #155.
      - name: Build docs
        run: uv run sphinx-build -W --keep-going -b html docs/source docs/build

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Install UV
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Build
        run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist

  # Every Python on ubuntu, always. The other platforms only on the edge
  # versions, and only where they can pay for themselves: on a push to
  # main/next, or on a PR labelled ci:full-matrix.
  #
  # pyasn1 is pure Python, so the interpreter version is where the risk lives
  # and the OS mostly is not. Of the platforms, Windows is the one that can
  # actually diverge — cp1252 as the default encoding, path handling — and it
  # had never been tested at all; macOS differs from Linux in nothing this
  # library touches. Running five macOS jobs per PR also sat exactly on the
  # free-tier cap of five concurrent macOS jobs for public repos, so two
  # overlapping runs queued until they timed out.
  setup-matrix:
    name: matrix
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.plan.outputs.include }}
    steps:
      - id: plan
        env:
          BROAD: >-
            ${{ github.event_name != 'pull_request'
              || contains(github.event.pull_request.labels.*.name, 'ci:full-matrix') }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os

          pythons = ["3.10", "3.11", "3.12", "3.13", "3.14"]
          jobs = [{"os": "ubuntu-latest", "python": p} for p in pythons]

          if os.environ["BROAD"] == "true":
              for platform in ("macos-latest", "windows-latest"):
                  jobs += [{"os": platform, "python": p}
                           for p in (pythons[0], pythons[-1])]

          print("include=" + json.dumps(jobs))
          PY

  run-unit-tests:
    name: test-unit
    strategy:
      matrix:
        include: ${{ fromJSON(needs.setup-matrix.outputs.include) }}
      fail-fast: false
    # Windows has never run here, so it reports without blocking until it has a
    # track record. Remove this once it does.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    runs-on: ${{ matrix.os }}
    needs:
      - build
      - setup-matrix
    steps:
      - uses: actions/checkout@v7
      - name: Setup python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install UV
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Run tests
        # Windows runners default to pwsh; this block is bash on every platform.
        shell: bash
        run: >
          uv run --locked --group dev --python ${{ matrix.python }}
          pytest --junitxml=test-results/results.xml --cov=pyasn1 --cov-report=xml tests
      - uses: actions/upload-artifact@v7
        # Results are most wanted when the suite failed.
        if: always()
        with:
          # Artifact names must be unique within a run.
          name: test-results-${{ matrix.os }}-${{ matrix.python }}
          path: test-results
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: ${{ matrix.os }}, ${{ matrix.python }}
          # A Codecov outage is not a reason to fail a build.
          fail_ci_if_error: false

  publish:
    name: Build Release
    # Semantic release cuts tags from a branch, so keep this to branch refs and
    # it can never re-enter on a tag it created itself. The push triggers are
    # filtered to main and next, but a dispatch can name any branch, so name
    # them again here: next cuts the rc, main cuts the GA, nothing else runs.
    if: >-
      github.ref == 'refs/heads/main' || github.ref == 'refs/heads/next'
    env:
      # Releasing is a deliberate act on both branches. Every push — to next as
      # much as to main — rehearses the release and stops; only a dispatch cuts
      # one. Automatic rcs are what let next drift below a GA already on PyPI.
      DRY: ${{ github.event_name != 'workflow_dispatch' }}
    needs:
      - build
      - run-unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          persist-credentials: false
      - name: Setup python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Install UV
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Build
        run: uv build
      - name: Semantic Release
        id: semrel
        uses: cycjimmy/semantic-release-action@v6
        with:
          semantic_version: 24
          dry_run: ${{ env.DRY }}
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/exec
            @semantic-release/git
            @google/semantic-release-replace-plugin
            conventional-changelog-conventionalcommits@8.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.SEMREL_TOKEN }}

      # Every push is a dry run: semantic-release works out the version that a
      # dispatch would cut but tags nothing, and its prepare step (which is what
      # normally builds) never runs. Build that version as a .devN instead and
      # keep it as an artifact, so what next would release as an rc, and what
      # main would release as the GA, can be installed and exercised before
      # anyone dispatches the real thing.
      - name: Build dev preview
        id: preview
        if: env.DRY == 'true'
        env:
          VERSION: ${{ steps.semrel.outputs.new_release_version }}
        run: |
          set -euo pipefail
          version="$VERSION"
          if [ -z "$version" ]; then
            echo "No release would be cut from this commit; nothing to preview."
            exit 0
          fi
          preview="${version}.dev${{ github.run_number }}"
          echo "Building preview ${preview}"
          sed -i -E "s/^version ?=.*/version = \"${preview}\"/" pyproject.toml
          sed -i -E "s/^__version__ ?=.*/__version__ = \"${preview}\"/" pyasn1/__init__.py
          rm -rf dist
          uv lock
          uv build
          echo "preview=${preview}" >> "$GITHUB_OUTPUT"

      - name: Upload dev preview
        if: env.DRY == 'true' && steps.preview.outputs.preview != ''
        uses: actions/upload-artifact@v7
        with:
          name: dist-preview-${{ steps.preview.outputs.preview }}
          path: dist/
          retention-days: 14

