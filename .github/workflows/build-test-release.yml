name: CI

on:
  push:
    branches:
      - "main"
      - "next"
  pull_request:
    branches: [main, next]
    # `labeled` so that adding ci:full-matrix re-runs with macOS included.
    types: [opened, synchronize, reopened, labeled]
  # main never releases on push (see the publish job's DRY). Cutting the GA
  # release from main is a deliberate manual act; rcs come from next.
  workflow_dispatch:

# One run per PR: a new push supersedes the one still in flight. Pushes to
# main/next are never cancelled, they can cut a release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Add permissions needed for semantic-release
permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - uses: pre-commit/action@v3.0.1

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install UV
        uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: uv sync --locked
      - name: Run Ruff
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Run mypy
        run: uv run mypy

      # Advisory only. ty is pre-1.0 and has no disallow_untyped_defs
      # equivalent, so mypy above remains the blocking gate. ty catches
      # things mypy misses, notably Liskov override violations.
      - name: Run ty (advisory)
        run: uv run ty check pyasn1
        continue-on-error: true

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install UV
        uses: astral-sh/setup-uv@v7
      - name: Build docs
        run: uv run sphinx-build -W -b html docs/source docs/build

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Install UV
        uses: astral-sh/setup-uv@v7
      - name: Build
        run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist

  # Every Python on ubuntu, always. The other platforms only on the edge
  # versions, and only where they can pay for themselves: on a push to
  # main/next, or on a PR labelled ci:full-matrix.
  #
  # pyasn1 is pure Python, so the interpreter version is where the risk lives
  # and the OS mostly is not. Of the platforms, Windows is the one that can
  # actually diverge — cp1252 as the default encoding, path handling — and it
  # had never been tested at all; macOS differs from Linux in nothing this
  # library touches. Running five macOS jobs per PR also sat exactly on the
  # free-tier cap of five concurrent macOS jobs for public repos, so two
  # overlapping runs queued until they timed out.
  setup-matrix:
    name: matrix
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.plan.outputs.include }}
    steps:
      - id: plan
        env:
          BROAD: >-
            ${{ github.event_name != 'pull_request'
              || contains(github.event.pull_request.labels.*.name, 'ci:full-matrix') }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os

          pythons = ["3.10", "3.11", "3.12", "3.13", "3.14"]
          jobs = [{"os": "ubuntu-latest", "python": p} for p in pythons]

          if os.environ["BROAD"] == "true":
              for platform in ("macos-latest", "windows-latest"):
                  jobs += [{"os": platform, "python": p}
                           for p in (pythons[0], pythons[-1])]

          print("include=" + json.dumps(jobs))
          PY

  run-unit-tests:
    name: test-unit
    strategy:
      matrix:
        include: ${{ fromJSON(needs.setup-matrix.outputs.include) }}
      fail-fast: false
    # Windows has never run here, so it reports without blocking until it has a
    # track record. Remove this once it does.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    runs-on: ${{ matrix.os }}
    needs:
      - build
      - setup-matrix
    steps:
      - uses: actions/checkout@v7
      - name: Setup python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install UV
        uses: astral-sh/setup-uv@v7
      - name: Run tests
        # Windows runners default to pwsh; this block is bash on every platform.
        shell: bash
        run: |
          uv sync --locked --python ${{ matrix.python }}
          uv run pytest --junitxml=test-results/results.xml --cov=pyasn1 --cov-report=xml tests
      - uses: actions/upload-artifact@v7
        with:
          # Artifact names must be unique within a run.
          name: test-results-${{ matrix.os }}-${{ matrix.python }}
          path: test-results
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: ${{ matrix.os }}, ${{ matrix.python }}

  publish:
    name: Build Release
    # Semantic release cuts tags from a branch, so keep this to branch refs and
    # it can never re-enter on a tag it created itself. A manual dispatch
    # releases from main only; dispatching any other ref would set DRY false
    # and cut a release from it.
    if: >-
      startsWith(github.ref, 'refs/heads/')
      && (github.event_name != 'workflow_dispatch' || github.ref_name == 'main')
    env:
      # next keeps auto-publishing rc on push. main only releases when a
      # human dispatches this workflow; a plain push to main is a dry run.
      DRY: ${{ github.event_name != 'workflow_dispatch' && github.ref_name == 'main' }}
    needs:
      - build
      - run-unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          persist-credentials: false
      - name: Setup python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Install UV
        uses: astral-sh/setup-uv@v7
      - name: Build
        run: uv build
      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v6
        with:
          semantic_version: 24
          dry_run: ${{ env.DRY }}
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/exec
            @semantic-release/git
            @google/semantic-release-replace-plugin
        env:
          GITHUB_TOKEN: ${{ secrets.SEMREL_TOKEN }}
          # Don't publish to PyPI here, the tag push will trigger the publish workflow
          GITHUB_OUTPUT: /tmp/semantic_release_output

      # A push to main is a dry run: semantic-release works out the version that
      # a dispatch would cut but tags nothing, and its prepare step (which is
      # what normally builds) never runs. Build that version as a .devN instead
      # and keep it as an artifact, so the GA candidate can be installed and
      # exercised before anyone dispatches the real release.
      - name: Build dev preview
        id: preview
        if: env.DRY == 'true'
        run: |
          set -euo pipefail
          # Step outputs are redirected above, so read the version from there.
          version=$(sed -n 's/^new_release_version=//p' /tmp/semantic_release_output | head -1)
          if [ -z "$version" ]; then
            echo "No release would be cut from this commit; nothing to preview."
            exit 0
          fi
          preview="${version}.dev${{ github.run_number }}"
          echo "Building preview ${preview}"
          sed -i -E "s/^version ?=.*/version = \"${preview}\"/" pyproject.toml
          sed -i -E "s/^__version__ ?=.*/__version__ = \"${preview}\"/" pyasn1/__init__.py
          rm -rf dist
          uv lock
          uv build
          echo "preview=${preview}" >> "$GITHUB_OUTPUT"

      - name: Upload dev preview
        if: env.DRY == 'true' && steps.preview.outputs.preview != ''
        uses: actions/upload-artifact@v7
        with:
          name: dist-preview-${{ steps.preview.outputs.preview }}
          path: dist/
          retention-days: 14

