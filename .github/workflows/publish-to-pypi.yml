name: Publish to PyPI

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

# Add permissions needed for publishing
permissions:
  contents: read

jobs:
  # First validate the tag matches the version in the files
  validate-version:
    name: Validate Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify version matches tag
        run: |
          # Extract version from the tag (e.g., v1.2.3 -> 1.2.3)
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          # Get version from pyproject.toml
          FILE_VERSION=$(grep -m 1 "version" pyproject.toml | sed -E 's/.*"(.*)"/\1/' | sed -E 's/.*'"'"'(.*)'"'"'/\1/')
          echo "Tag version: $TAG_VERSION"
          echo "File version: $FILE_VERSION"
          # Verify versions match
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "Error: Tag version ($TAG_VERSION) does not match version in pyproject.toml ($FILE_VERSION)"
            exit 1
          fi

  # Build the packages for multiple platforms using tox
  build-packages:
    name: Build packages on ${{ matrix.os }} / Python ${{ matrix.python-version }}
    needs: [validate-version]
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine tox
      - name: Build package
        run: python -m build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}-${{ matrix.python-version }}
          path: dist/

  # Publish all built packages to PyPI
  publish-to-pypi:
    name: Publish Release to PyPI
    needs: [build-packages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install tox
        run: |
          python -m pip install --upgrade pip
          python -m pip install tox
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Organize artifacts
        run: |
          mkdir -p dist
          find artifacts -name "*.whl" -o -name "*.tar.gz" | xargs -I{} cp {} dist/
          ls -la dist/
      - name: Publish to PyPI with tox
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: tox -e publish
