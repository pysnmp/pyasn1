name: Publish to PyPI

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

# Add permissions needed for publishing
permissions:
  contents: read

jobs:
  publish-to-pypi:
    name: Publish Release to PyPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Need to fetch tags for proper versioning
          fetch-depth: 0
      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine poetry
      - name: Build package
        run: python -m build
      - name: Verify version matches tag
        run: |
          # Extract version from the tag (e.g., v1.2.3 -> 1.2.3)
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          # Get version from pyproject.toml
          FILE_VERSION=$(grep -m 1 "version" pyproject.toml | sed -E 's/.*"(.*)"/\1/' | sed -E 's/.*'"'"'(.*)'"'"'/\1/')
          echo "Tag version: $TAG_VERSION"
          echo "File version: $FILE_VERSION"
          # Verify versions match
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "Error: Tag version ($TAG_VERSION) does not match version in pyproject.toml ($FILE_VERSION)"
            exit 1
          fi
      - name: Publish to PyPI
        env:
          PYPI_USERNAME: ${{ secrets.PYPI_USERNAME }}
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          poetry config pypi-token.pypi ${PYPI_TOKEN}
          poetry publish -n
