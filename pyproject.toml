[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pysnmp-pyasn1"
version = "1.1.4-beta.4"
description = "ASN.1 types and codecs"
readme = "README.md"
license = "BSD-2-Clause"
requires-python = ">=3.10"
authors = [
    {name = "rfaircloth-splunk", email = "rfaircloth@splunk.com"},
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Telecommunications Industry",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "pylint>=3.0",
    "mypy>=1.0",
    "Sphinx>=4.3",
    "pre-commit>=3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["pyasn1"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",    # line-too-long — existing codebase has long lines
    "E721",    # type-comparison — existing pattern
    "E731",    # lambda-assignment — existing codebase style
    "E741",    # ambiguous-variable-name — ASN.1 naming conventions
    "E712",    # true-false-comparison — existing pattern
    "E402",    # module-import-not-at-top — some imports after variable defs
    "B011",    # assert-false — used in tests
    "B904",    # raise-without-from-inside-except — existing pattern
    "B006",    # mutable-argument-default — existing pattern
    "B007",    # unused-loop-control-variable — existing pattern
    "B905",    # zip-without-explicit-strict — existing pattern
    "SIM108",  # if-else-block-instead-of-if-exp — readability preference
    "SIM102",  # collapsible-if — readability preference
    "SIM105",  # suppressible-exception — existing pattern
    "SIM101",  # duplicate-isinstance-call — existing pattern
    "SIM110",  # reimplemented-builtin — existing pattern
    "UP031",   # printf-string-formatting — existing codebase style
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "SIM"]  # relax rules for tests

[tool.pylint.messages_control]
disable = [
    "C0114",  # missing-module-docstring
    "C0115",  # missing-class-docstring
    "C0116",  # missing-function-docstring
    "R0903",  # too-few-public-methods
    "R0913",  # too-many-arguments
]

[tool.pylint.format]
max-line-length = 88

[tool.pylint.basic]
good-names = ["e", "f", "i", "j", "k", "n", "o", "s", "x", "id", "dt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
