[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pysnmp-pyasn1"
version = "1.1.4-beta.7"
description = "ASN.1 types and codecs"
readme = "README.md"
license = "BSD-2-Clause"
requires-python = ">=3.10"
authors = [
    {name = "Ryan Faircloth", email = "actual@rfaircloth.com"},
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Telecommunications Industry",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
    "mypy>=2.3.1",
    "Sphinx>=9.1.0; python_version >= '3.12'",
    "pre-commit>=4.6.2",
]

[tool.hatch.build.targets.wheel]
packages = ["pyasn1"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PL", "RUF"]
ignore = [
    "E501",    # line-too-long — existing codebase has long lines
    "E721",    # type-comparison — existing pattern
    "E731",    # lambda-assignment — existing codebase style
    "E741",    # ambiguous-variable-name — ASN.1 naming conventions
    "E712",    # true-false-comparison — existing pattern
    "E402",    # module-import-not-at-top — some imports after variable defs
    "B011",    # assert-false — used in tests
    "B006",    # mutable-argument-default — existing pattern
    "B007",    # unused-loop-control-variable — existing pattern
    "B905",    # zip-without-explicit-strict — existing pattern
    "SIM108",  # if-else-block-instead-of-if-exp — readability preference
    "SIM102",  # collapsible-if — readability preference
    "SIM105",  # suppressible-exception — existing pattern
    "SIM101",  # duplicate-isinstance-call — existing pattern
    "SIM110",  # reimplemented-builtin — existing pattern
    "UP031",   # printf-string-formatting — existing codebase style
    # Migrated from the former [tool.pylint] config: R0913 was disabled there,
    # and ASN.1 codecs are inherently branchy, so the complexity family stays off.
    "PLR0911",  # too-many-return-statements
    "PLR0912",  # too-many-branches
    "PLR0913",  # too-many-arguments — was disabled for pylint
    "PLR0915",  # too-many-statements
    "PLR0917",  # too-many-positional-arguments
    "PLR2004",  # magic-value-comparison — ASN.1 tag and length constants
    "PLC0415",  # import-outside-top-level — deliberate, breaks import cycles
    "PLW2901",  # redefined-loop-name — existing pattern
    "RUF005",   # collection-literal-concatenation — style preference
    "RUF012",   # mutable-class-default — existing pattern
    "RUF021",   # parenthesize-chained-operators — existing pattern
    "RUF059",   # unused-unpacked-variable — matches B007 above
    "PLW0603",  # global-statement — setLogger() intentionally rebinds the module logger
    "PLW1641",  # eq-without-hash — constructed types are mutable, so deliberately
                # unhashable; SimpleAsn1Type re-adds __hash__ where it is wanted
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "SIM", "PL", "RUF"]  # relax rules for tests

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["pyasn1"]
relative_files = true
