[project]
name = "pysnmp-pyasn1"
version = "1.1.4-beta.4"
description = "ASN.1 types and codecs"
authors = [{ name = "rfaircloth-splunk", email = "rfaircloth@splunk.com" }]
license = "BSD-2-Clause"
license-files = ["LICENSE.rst"]
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Telecommunications Industry",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Repository = "https://github.com/pysnmp/pyasn1"

[dependency-groups]
dev = [
    "Sphinx>=9.1.0; python_version >= '3.12'",
    "isort>=9.0.1",
    "black>=26.5.1",
    "pyflakes>=3.4.0",
    "autoflake>=2.4.0",
    "flake8>=7.3.0",
    "pre-commit>=4.6.2",
    "mypy>=2.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyasn1"]

[tool.hatch.build.targets.sdist]
include = ["pyasn1", "docs", "tests", "README.md", "LICENSE.rst"]

# Configure Black formatting
[tool.black]
line-length = 100
target-version = ["py310"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.tox
  | \.venv
  | _build
  | build
  | dist
)/
'''

# Configure isort to be compatible with black
[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
skip_gitignore = true
skip_glob = ["*.pyi", ".git/*", ".tox/*", ".venv/*", "build/*", "dist/*"]
